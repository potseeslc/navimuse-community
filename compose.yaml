services:
  navimuse:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8099:8099"
    environment:
      PORT: "8099"
      NAVIMUSE_DATA_DIR: /data
      NAVIDROME_URL: ${NAVIDROME_URL:?Set NAVIDROME_URL in .env}
      PUBLIC_NAVIDROME_URL: ${NAVIDROME_URL}
      AUDIOMUSE_URL: ${AUDIOMUSE_URL:-}
      PUBLIC_AUDIOMUSE_URL: ${AUDIOMUSE_URL:-}
    volumes:
      - navimuse_data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8099/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
volumes:
  navimuse_data:
